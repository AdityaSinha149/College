<!DOCTYPE html>
<html>
    <head>
        <title>
            View Products
        </title>
    </head>
    <body>
        <table>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Description</th>
            </tr>
            {%for product in products%}
            <tr>
                <td>{{product.title}}</td>
                <td>{{product.price}}</td>
                <td>{{product.description}}</td>
            </tr>
        
            {%empty%}
            <tr>
                <td>NO products untill now</td>
            </tr>

            {%endfor%}
        </table>
    </body>
</html>
